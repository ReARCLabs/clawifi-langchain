[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-clawifi"
version = "0.1.0"
description = "LangChain tools for Clawifi web search and page reading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ReARC Labs Inc." }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain-core>=1.4.7,<2.0.0",
    "clawifi>=0.4.5,<0.5",
]
keywords = ["langchain", "clawifi", "web-search", "agents", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://clawifi.dev"
Documentation = "https://clawifi.dev/docs"
Repository = "https://github.com/ReARCLabs/clawifi-langchain"
Issues = "https://github.com/ReARCLabs/clawifi-langchain/issues"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "langchain-tests>=1.1.9,<2.0.0",
]
lint = ["ruff>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_clawifi"]

[tool.hatch.build.targets.sdist]
include = ["langchain_clawifi/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
